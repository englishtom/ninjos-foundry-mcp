# Checks every push to main and every pull request: versions, types, language files, tests.
# Checks also run in forks; publishing remains restricted to the upstream repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No commit hook in CI: npm ci would otherwise point Git at .husky.
env:
  HUSKY: 0

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Version sources agree
        run: node scripts/check-version.mjs

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Language files
        run: npm run lang:check

      - name: No references to working notes or private names
        run: npm run check:public

      - name: Tests
        run: npm test

      - name: Build and verify the macOS bundle
        if: runner.os == 'macOS'
        run: |
          curl --fail --silent --show-error --location --output node-license.txt "https://raw.githubusercontent.com/nodejs/node/$(node --version)/LICENSE"
          node installer/build.mjs --node-license node-license.txt
          node installer/verify-bundle.mjs
